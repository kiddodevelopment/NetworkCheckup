[package]
name = "netcheck"
version = "0.4.0"
edition = "2021"
description = "Network Checkup diagnostic engine"

[lib]
path = "src/lib.rs"

[[bin]]
name = "netcheck-cli"
path = "src/bin/cli.rs"

[features]
default = ["tls"]
# HTTPS probes and certificate details. Off only for cross-target type checks.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:x509-parser"]

[dependencies]
ipnet = "2.12"
chrono = "0.4.45"
flate2 = "1.1.11"
futures = "0.3.34"
netdev = "0.48.0"
regex = "1.13.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }
x509-parser = { version = "0.18.1", optional = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
