[package]
name = "network-checkup"
version = "0.4.0"
description = "Network Checkup desktop app"
edition = "2021"
publish = false

[lib]
name = "network_checkup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
netcheck = { path = "../crates/netcheck", default-features = false }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1.0.229", features = ["derive"] }
chrono = "0.4.45"

[features]
default = ["tls"]
tls = ["netcheck/tls"]
