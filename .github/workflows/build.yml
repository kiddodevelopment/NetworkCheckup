name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
      - name: Build universal app (Intel + Apple silicon)
        run: wails build -clean -skipbindings -platform darwin/universal -trimpath
      - name: Ad-hoc sign and zip
        run: |
          codesign --force --deep -s - "build/bin/Network Checkup.app"
          ditto -c -k --keepParent "build/bin/Network Checkup.app" NetworkCheckup-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NetworkCheckup-macOS
          path: NetworkCheckup-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NetworkCheckup-Windows
          path: build/bin/*.exe
