name: Build apps

on:
  push:
    branches: [main, tauri]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (checks engine)
        run: cargo test -p netcheck

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Rust targets for Intel + Apple silicon
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build universal app (ad-hoc signed)
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Zip the app
        run: |
          cd target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent "Network Checkup.app" "$GITHUB_WORKSPACE/NetworkCheckup-macOS.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: NetworkCheckup-macOS
          path: |
            NetworkCheckup-macOS.zip
            target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build exe and installers
        run: npx tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v5
        with:
          name: NetworkCheckup-Windows
          path: |
            target/release/NetworkCheckup.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
